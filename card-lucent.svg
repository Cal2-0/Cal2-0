<svg width="435" height="180" viewBox="0 0 435 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="435" height="180" fill="#0d1512" stroke="#e0b93e" stroke-width="1.5" rx="8"/>

  <!-- Command Line Prompt -->
  <text x="18" y="32" font-family="Fira Code, monospace" font-size="11" fill="#4a6b58">$ <tspan fill="#eafff2">lucent scan</tspan> <tspan fill="#e0b93e">--media sample.mp4</tspan> <tspan fill="#7a9a88">--fft</tspan></text>

  <!-- Execution Output Text -->
  <text x="18" y="60" font-family="Fira Code, monospace" font-size="11" fill="#e0b93e" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    decomposing high-frequency spectral residual...
  </text>

  <!-- Animated Progress Bar -->
  <g transform="translate(18, 76)">
    <rect x="0" y="0" width="398" height="12" fill="#070a08" rx="3"/>
    <rect x="0" y="0" width="363" height="12" fill="#e0b93e" rx="3">
      <animate attributeName="width" values="0;363" dur="1.8s" fill="freeze"/>
    </rect>
    <text x="368" y="10" font-family="Fira Code, monospace" font-size="9" text-anchor="end" fill="#070a08" font-weight="600">91%</text>
  </g>

  <!-- Result Output -->
  <g transform="translate(18, 118)">
    <text x="0" y="0" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">result: <tspan fill="#e0b93e">SYNTHETIC_GENERATION</tspan> · <tspan fill="#ff5c5c">spike @ 14.2kHz</tspan></text>
    <text x="0" y="18" font-family="Fira Code, monospace" font-size="9" fill="#7a9a88">interpretable frequency-domain anomaly detection</text>
  </g>

  <!-- Tech Stack Line -->
  <line x1="18" y1="150" x2="417" y2="150" stroke="#1a2a22" stroke-width="1"/>
  <text x="18" y="166" font-family="Fira Code, monospace" font-size="9" fill="#4a6b58">PyTorch · OpenCV · FFT · Diffusion Reconstruction · Python</text>
</svg>

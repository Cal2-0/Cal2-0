<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-sentinel" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e0c"/>
      <stop offset="100%" stop-color="#080c0a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg-sentinel)" rx="6"/>
  <rect x="2" y="2" width="896" height="256" fill="none" stroke="#1a2a22" stroke-width="1.5" rx="5"/>

  <!-- Header -->
  <text x="30" y="32" font-family="Fira Code, monospace" font-size="13" font-weight="600" fill="#39FF88" letter-spacing="1">SENTINEL-AI // THREE-VECTOR INCIDENT RESPONSE PIPELINE</text>
  <text x="730" y="32" font-family="Fira Code, monospace" font-size="11" fill="#4a6b58">STATUS: ACTIVE SCAN</text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#1a2a22" stroke-width="1"/>

  <!-- PIPELINE INPUT VECTORS (Left Column) -->
  <!-- Vector 1: Auth Log Anomaly -->
  <g transform="translate(40, 65)">
    <rect x="0" y="0" width="220" height="48" fill="#0d1512" stroke="#2c4a3a" rx="4"/>
    <text x="15" y="22" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">VECTOR 1: AUTH LOGS</text>
    <text x="15" y="38" font-family="Fira Code, monospace" font-size="9" fill="#e0b93e">Isolation Forest Anomaly Model</text>
  </g>

  <!-- Vector 2: AST Code Inspection -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="220" height="48" fill="#0d1512" stroke="#2c4a3a" rx="4"/>
    <text x="15" y="22" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">VECTOR 2: PACKAGE AST</text>
    <text x="15" y="38" font-family="Fira Code, monospace" font-size="9" fill="#39FF88">Static AST Code Inspection</text>
  </g>

  <!-- Vector 3: NVD / EPSS Threat Feed -->
  <g transform="translate(40, 185)">
    <rect x="0" y="0" width="220" height="48" fill="#0d1512" stroke="#2c4a3a" rx="4"/>
    <text x="15" y="22" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">VECTOR 3: NVD / EPSS</text>
    <text x="15" y="38" font-family="Fira Code, monospace" font-size="9" fill="#7a9a88">CVE &amp; Exploit Likelihood Feed</text>
  </g>

  <!-- CONNECTING PATHS TO ENGINE -->
  <g stroke="#2c4a3a" stroke-width="1.5" fill="none">
    <path id="p1" d="M260 89 L390 149"/>
    <path id="p2" d="M260 149 L390 149"/>
    <path id="p3" d="M260 209 L390 149"/>
    <path id="pOut" d="M590 149 L670 149"/>
  </g>

  <!-- PULSING DATA PACKETS -->
  <g fill="#39FF88">
    <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.3s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.0s" repeatCount="indefinite" begin="0.6s"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#ff5c5c"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0s"><mpath href="#pOut"/></animateMotion></circle>
  </g>

  <!-- CENTRAL ENGINE CORE -->
  <g transform="translate(390, 85)">
    <rect x="0" y="0" width="200" height="128" fill="#0d1512" stroke="#39FF88" stroke-width="2" rx="6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Inner Core Visual -->
    <rect x="15" y="15" width="170" height="98" fill="#070a08" rx="4"/>
    <text x="100" y="42" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#39FF88">SENTINEL ENGINE</text>
    <line x1="30" y1="52" x2="170" y2="52" stroke="#1a2a22" stroke-width="1"/>

    <text x="100" y="72" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#7a9a88">Cross-Vector Risk Fusion</text>
    <text x="100" y="90" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#e0b93e">Prioritization Matrix</text>

    <!-- Spinning Core Status Indicator -->
    <circle cx="100" cy="104" r="3" fill="#39FF88"/>
  </g>

  <!-- OUTPUT REPORT PANEL (Right Column) -->
  <g transform="translate(670, 75)">
    <rect x="0" y="0" width="190" height="148" fill="#0d1512" stroke="#ff5c5c" stroke-width="1.5" rx="6"/>
    <rect x="10" y="10" width="170" height="26" fill="#1b0e10" rx="3"/>
    <text x="95" y="27" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" font-weight="600" fill="#ff5c5c">INCIDENT REPORT</text>

    <text x="20" y="58" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Auth Anomaly: <tspan fill="#ff5c5c">HIGH</tspan></text>
    <text x="20" y="78" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">AST Package: <tspan fill="#39FF88">CLEAN</tspan></text>
    <text x="20" y="98" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">NVD Exposure: <tspan fill="#e0b93e">CVE-2025</tspan></text>

    <line x1="15" y1="112" x2="175" y2="112" stroke="#2c1a1d" stroke-width="1"/>
    <text x="95" y="132" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" font-weight="600" fill="#39FF88">ACTION: ISOLATED</text>
  </g>
</svg>

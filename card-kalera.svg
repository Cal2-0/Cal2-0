<svg width="435" height="190" viewBox="0 0 435 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg-kalera" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F13"/>
      <stop offset="100%" stop-color="#151922"/>
    </linearGradient>
    <linearGradient id="border-glow-kalera" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9B8A8"/>
      <stop offset="50%" stop-color="#39FF88"/>
      <stop offset="100%" stop-color="#C9B8A8"/>
    </linearGradient>
  </defs>

  <!-- Background Box -->
  <rect x="1" y="1" width="433" height="188" rx="8" fill="url(#card-bg-kalera)" stroke="url(#border-glow-kalera)" stroke-width="1.5"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="36" x2="435" y2="36" stroke="#C9B8A8" stroke-width="0.5" opacity="0.2"/>
  <line x1="300" y1="0" x2="300" y2="36" stroke="#C9B8A8" stroke-width="0.5" opacity="0.2"/>

  <!-- Status Light & Header Tag -->
  <circle cx="20" cy="18" r="4" fill="#39FF88">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#39FF88" letter-spacing="1">CRYPTO // POST-QUANTUM STEGO</text>
  
  <!-- Live App Link Badge -->
  <a href="https://kaleraapp.netlify.app/" target="_blank">
    <rect x="295" y="8" width="130" height="20" rx="4" fill="#1C222E" stroke="#39FF88" stroke-width="0.8"/>
    <text x="360" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#39FF88" text-anchor="middle">LIVE APP ↗</text>
  </a>

  <!-- Project Title -->
  <text x="20" y="62" font-family="sans-serif" font-size="20" font-weight="bold" fill="#EAE0D5">Kalera</text>
  <text x="96" y="62" font-family="sans-serif" font-size="12" fill="#8A8078">· Post-Quantum Steganography</text>

  <!-- Key Highlights -->
  <text x="20" y="86" font-family="sans-serif" font-size="11" fill="#C9B8A8">• NIST-Compliant ML-KEM-1024 Key Encapsulation</text>
  <text x="20" y="104" font-family="sans-serif" font-size="11" fill="#C9B8A8">• SPHINCS+ Quantum-Resistant Digital Signatures</text>
  <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#C9B8A8">• Live Demo: kaleraapp.netlify.app</text>

  <!-- Tech Badges Bar -->
  <rect x="20" y="142" width="102" height="22" rx="4" fill="#1C222E" stroke="#39FF88" stroke-width="0.5"/>
  <text x="71" y="156" font-family="sans-serif" font-size="10" fill="#39FF88" font-weight="bold" text-anchor="middle">ML-KEM-1024</text>

  <rect x="128" y="142" width="76" height="22" rx="4" fill="#1C222E" stroke="#39FF88" stroke-width="0.5"/>
  <text x="166" y="156" font-family="sans-serif" font-size="10" fill="#39FF88" font-weight="bold" text-anchor="middle">SPHINCS+</text>

  <rect x="210" y="142" width="88" height="22" rx="4" fill="#1C222E" stroke="#C9B8A8" stroke-width="0.5"/>
  <text x="254" y="156" font-family="sans-serif" font-size="10" fill="#C9B8A8" font-weight="bold" text-anchor="middle">HKDF-SHA3</text>

  <rect x="304" y="142" width="60" height="22" rx="4" fill="#1C222E" stroke="#C9B8A8" stroke-width="0.5"/>
  <text x="334" y="156" font-family="sans-serif" font-size="10" fill="#C9B8A8" font-weight="bold" text-anchor="middle">Python</text>
</svg>

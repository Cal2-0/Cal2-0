<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-radar" x1="0" y1="0" x2="900" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e0c"/>
      <stop offset="100%" stop-color="#070a08"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="180" cy="180" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39FF88" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#39FF88" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="340" fill="url(#bg-radar)" rx="6"/>
  <rect x="2" y="2" width="896" height="336" fill="none" stroke="#1a2a22" stroke-width="1.5" rx="5"/>

  <!-- HUD Corner Ticks -->
  <path d="M12 25 H25 V12 M875 12 H888 V25 M888 315 H875 V328 M25 328 H12 V315" fill="none" stroke="#39FF88" stroke-width="2" opacity="0.7"/>

  <!-- Header Banner -->
  <text x="30" y="32" font-family="Fira Code, monospace" font-size="13" font-weight="600" fill="#39FF88" letter-spacing="1">TECHNICAL ARSENAL // RADAR TELEMETRY MATRIX</text>
  <text x="730" y="32" font-family="Fira Code, monospace" font-size="11" fill="#4a6b58">STATUS: ACTIVE [1000 HZ]</text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#1a2a22" stroke-width="1"/>

  <!-- RADAR DISPLAY (Left Section) -->
  <g transform="translate(0, 10)">
    <!-- Concentric Circles -->
    <circle cx="190" cy="180" r="40" fill="none" stroke="#1a2a22" stroke-width="1"/>
    <circle cx="190" cy="180" r="80" fill="none" stroke="#1a2a22" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="190" cy="180" r="120" fill="none" stroke="#2c4a3a" stroke-width="1.5"/>

    <!-- Crosshairs -->
    <line x1="70" y1="180" x2="310" y2="180" stroke="#1a2a22" stroke-width="1.5"/>
    <line x1="190" y1="60" x2="190" y2="300" stroke="#1a2a22" stroke-width="1.5"/>
    <line x1="105" y1="95" x2="275" y2="265" stroke="#14201a" stroke-width="1"/>
    <line x1="105" y1="265" x2="275" y2="95" stroke="#14201a" stroke-width="1"/>

    <!-- Animated Radar Sweep -->
    <g transform="translate(190, 180)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <path d="M0 0 L120 0 A120 120 0 0 0 0 -120 Z" fill="url(#radarSweep)"/>
        <line x1="0" y1="0" x2="120" y2="0" stroke="#39FF88" stroke-width="2" opacity="0.8"/>
      </g>
    </g>

    <!-- Radar Target Nodes -->
    <!-- Node 1: On-Chain Forensics -->
    <g>
      <circle cx="250" cy="130" r="5" fill="#39FF88">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="130" r="12" fill="none" stroke="#39FF88" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="262" y="134" font-family="Fira Code, monospace" font-size="10" font-weight="600" fill="#eafff2">On-Chain Forensics</text>
    </g>

    <!-- Node 2: Deepfake FFT Signal -->
    <g>
      <circle cx="130" cy="120" r="5" fill="#e0b93e"/>
      <text x="50" y="115" font-family="Fira Code, monospace" font-size="10" fill="#e0b93e">Deepfake Signal AI</text>
    </g>

    <!-- Node 3: Post-Quantum Crypto -->
    <g>
      <circle cx="260" cy="230" r="5" fill="#39FF88"/>
      <text x="272" y="234" font-family="Fira Code, monospace" font-size="10" fill="#7a9a88">PQC / Stego</text>
    </g>

    <!-- Node 4: Reverse Eng / AST -->
    <g>
      <circle cx="120" cy="220" r="5" fill="#39FF88"/>
      <text x="45" y="235" font-family="Fira Code, monospace" font-size="10" fill="#7a9a88">AST Inspection</text>
    </g>

    <!-- Node 5: Low-Level C Sockets -->
    <g>
      <circle cx="190" cy="275" r="5" fill="#39FF88"/>
      <text x="190" y="292" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#7a9a88">Raw C Sockets</text>
    </g>
  </g>

  <!-- SKILL CAPACITY METRICS (Right Section) -->
  <g transform="translate(390, 55)">
    <!-- Metric 1: On-Chain Forensics & Blockchain -->
    <text x="0" y="20" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">ON-CHAIN FORENSICS &amp; CLUSTERING</text>
    <text x="440" y="20" font-family="Fira Code, monospace" font-size="11" text-anchor="end" fill="#39FF88">96%</text>
    <rect x="0" y="28" width="440" height="8" fill="#14201a" rx="4"/>
    <rect x="0" y="28" width="422" height="8" fill="#39FF88" rx="4">
      <animate attributeName="width" values="0;422" dur="1.5s" fill="freeze"/>
    </rect>
    <text x="0" y="48" font-family="Fira Code, monospace" font-size="9" fill="#4a6b58">React · D3.js · FastAPI · Etherscan RPC · Bitcoin / EVM / Solana</text>

    <!-- Metric 2: Deepfake Signal & Applied AI -->
    <text x="0" y="78" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">DEEPFAKE SIGNAL ANALYSIS &amp; APPLIED AI</text>
    <text x="440" y="78" font-family="Fira Code, monospace" font-size="11" text-anchor="end" fill="#e0b93e">92%</text>
    <rect x="0" y="86" width="440" height="8" fill="#14201a" rx="4"/>
    <rect x="0" y="86" width="404" height="8" fill="#e0b93e" rx="4">
      <animate attributeName="width" values="0;404" dur="1.8s" fill="freeze"/>
    </rect>
    <text x="0" y="106" font-family="Fira Code, monospace" font-size="9" fill="#4a6b58">PyTorch · OpenCV · FFT Residual Analysis · MediaPipe · LLMs</text>

    <!-- Metric 3: Post-Quantum Cryptography & Systems -->
    <text x="0" y="136" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">POST-QUANTUM CRYPTOGRAPHY &amp; SECURE SYSTEMS</text>
    <text x="440" y="136" font-family="Fira Code, monospace" font-size="11" text-anchor="end" fill="#39FF88">94%</text>
    <rect x="0" y="144" width="440" height="8" fill="#14201a" rx="4"/>
    <rect x="0" y="144" width="413" height="8" fill="#39FF88" rx="4">
      <animate attributeName="width" values="0;413" dur="2.0s" fill="freeze"/>
    </rect>
    <text x="0" y="164" font-family="Fira Code, monospace" font-size="9" fill="#4a6b58">ML-KEM-1024 · SPHINCS+ · Chaos Steganography · OAuth2 / IAM</text>

    <!-- Metric 4: Low-Level Systems & Network Recon -->
    <text x="0" y="194" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#eafff2">LOW-LEVEL SYSTEMS &amp; NETWORK INTELLIGENCE</text>
    <text x="440" y="194" font-family="Fira Code, monospace" font-size="11" text-anchor="end" fill="#39FF88">90%</text>
    <rect x="0" y="202" width="440" height="8" fill="#14201a" rx="4"/>
    <rect x="0" y="202" width="396" height="8" fill="#39FF88" rx="4">
      <animate attributeName="width" values="0;396" dur="2.2s" fill="freeze"/>
    </rect>
    <text x="0" y="222" font-family="Fira Code, monospace" font-size="9" fill="#4a6b58">C Raw Sockets · Scapy · Isolation Forest · Docker · Linux Kernel</text>

    <!-- HUD Telemetry Footer -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="440" height="24" fill="#0d1512" stroke="#1a2a22" rx="4"/>
      <circle cx="15" cy="12" r="4" fill="#39FF88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="16" font-family="Fira Code, monospace" font-size="10" fill="#39FF88">VERIFIED TELEMETRY</text>
      <text x="220" y="16" font-family="Fira Code, monospace" font-size="10" fill="#4a6b58">ARMY CYBER GROUP · NMAMIT 9.26</text>
    </g>
  </g>
</svg>

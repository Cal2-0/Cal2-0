<svg width="435" height="190" viewBox="0 0 435 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="subtle-bg-secureci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13111C"/>
      <stop offset="100%" stop-color="#181524"/>
    </linearGradient>
  </defs>

  <!-- Borderless Sleek Container -->
  <rect x="0" y="0" width="435" height="190" rx="8" fill="url(#subtle-bg-secureci)"/>
  
  <!-- Subtle Top Accent Line -->
  <rect x="20" y="0" width="80" height="2" rx="1" fill="#A89FBF" opacity="0.8"/>

  <!-- Subtitle Tag -->
  <text x="20" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#A89FBF" letter-spacing="1">DEVSECOPS PIPELINE</text>
  <text x="415" y="24" font-family="sans-serif" font-size="10" fill="#8E85A3" text-anchor="end">Active Scanner</text>

  <line x1="20" y1="34" x2="415" y2="34" stroke="#252136" stroke-width="1"/>

  <!-- Title -->
  <text x="20" y="62" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#EAE0D5">SecureCI</text>
  <text x="124" y="60" font-family="sans-serif" font-size="12" fill="#8E85A3">· GitHub Actions Security</text>

  <!-- Highlights -->
  <text x="20" y="86" font-family="sans-serif" font-size="11" fill="#D4CDE5">• Audits GitHub Actions for Unpinned 3rd Party Code</text>
  <text x="20" y="104" font-family="sans-serif" font-size="11" fill="#A89FBF">• Detects Poisoned Pipeline Risks &amp; Secret Leaks</text>
  <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#C5A059">• OWASP CI/CD Top 10 Compliance &amp; Auto-Fixing</text>

  <!-- Subtle Stack Tags -->
  <rect x="20" y="146" width="62" height="22" rx="4" fill="#1F1C2E"/>
  <text x="51" y="160" font-family="sans-serif" font-size="10" fill="#C5A059" text-anchor="middle">Python</text>

  <rect x="88" y="146" width="94" height="22" rx="4" fill="#1F1C2E"/>
  <text x="135" y="160" font-family="sans-serif" font-size="10" fill="#A89FBF" text-anchor="middle">YAML Parser</text>

  <rect x="188" y="146" width="112" height="22" rx="4" fill="#1F1C2E"/>
  <text x="244" y="160" font-family="sans-serif" font-size="10" fill="#A89FBF" text-anchor="middle">OWASP CI/CD</text>

  <rect x="306" y="146" width="68" height="22" rx="4" fill="#1F1C2E"/>
  <text x="340" y="160" font-family="sans-serif" font-size="10" fill="#A89FBF" text-anchor="middle">Actions</text>
</svg>

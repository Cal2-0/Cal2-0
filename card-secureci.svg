<svg width="435" height="190" viewBox="0 0 435 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg-secureci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#161B26"/>
    </linearGradient>
    <linearGradient id="border-gold-secureci" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="433" height="188" rx="6" fill="url(#card-bg-secureci)" stroke="url(#border-gold-secureci)" stroke-width="1.2"/>
  
  <!-- Subtle Header Separator -->
  <line x1="0" y1="36" x2="435" y2="36" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
  <line x1="290" y1="0" x2="290" y2="36" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>

  <!-- Status Light & Header Tag -->
  <circle cx="20" cy="18" r="4" fill="#88C0D0"/>
  <text x="32" y="22" font-family="'Georgia', serif" font-size="11" font-weight="bold" fill="#88C0D0" letter-spacing="0.5">DOSSIER // DEVSECOPS PIPELINE</text>
  
  <!-- Status Badge -->
  <rect x="300" y="8" width="125" height="20" rx="3" fill="#1C2333" stroke="#88C0D0" stroke-width="0.8"/>
  <text x="362" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#88C0D0" text-anchor="middle">ACTIVE SCANNER</text>

  <!-- Project Title -->
  <text x="20" y="62" font-family="'Georgia', serif" font-size="21" font-weight="bold" fill="#EAE0D5">SecureCI</text>
  <text x="124" y="62" font-family="sans-serif" font-size="12" fill="#A3B8CC">· GitHub Actions Security</text>

  <!-- Key Highlights -->
  <text x="20" y="86" font-family="sans-serif" font-size="11" fill="#EAE0D5">• Audits GitHub Actions for Unpinned 3rd Party Code</text>
  <text x="20" y="104" font-family="sans-serif" font-size="11" fill="#A3B8CC">• Detects Poisoned Pipeline Risks &amp; Secret Leaks</text>
  <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#D4AF37">• OWASP CI/CD Top 10 Compliance &amp; Auto-Fixing</text>

  <!-- Tech Badges Bar -->
  <rect x="20" y="142" width="62" height="22" rx="3" fill="#1A202C" stroke="#D4AF37" stroke-width="0.5"/>
  <text x="51" y="156" font-family="sans-serif" font-size="10" fill="#D4AF37" font-weight="bold" text-anchor="middle">Python</text>

  <rect x="88" y="142" width="94" height="22" rx="3" fill="#1A202C" stroke="#88C0D0" stroke-width="0.5"/>
  <text x="135" y="156" font-family="sans-serif" font-size="10" fill="#88C0D0" font-weight="bold" text-anchor="middle">YAML Parser</text>

  <rect x="188" y="142" width="112" height="22" rx="3" fill="#1A202C" stroke="#A3B8CC" stroke-width="0.5"/>
  <text x="244" y="156" font-family="sans-serif" font-size="10" fill="#A3B8CC" font-weight="bold" text-anchor="middle">OWASP CI/CD</text>

  <rect x="306" y="142" width="68" height="22" rx="3" fill="#1A202C" stroke="#A3B8CC" stroke-width="0.5"/>
  <text x="340" y="156" font-family="sans-serif" font-size="10" fill="#A3B8CC" font-weight="bold" text-anchor="middle">Actions</text>
</svg>

<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-kalera" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e0c"/>
      <stop offset="100%" stop-color="#090d10"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#bg-kalera)" rx="6"/>
  <rect x="2" y="2" width="896" height="236" fill="none" stroke="#1a2a22" stroke-width="1.5" rx="5"/>

  <!-- Header -->
  <text x="30" y="32" font-family="Fira Code, monospace" font-size="13" font-weight="600" fill="#39FF88" letter-spacing="1">KALERA // HYBRID POST-QUANTUM STEGANOGRAPHY ARCHITECTURE</text>
  <text x="730" y="32" font-family="Fira Code, monospace" font-size="11" fill="#4a6b58">PQC STATUS: ML-KEM-1024</text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#1a2a22" stroke-width="1"/>

  <!-- STEP 1: Post-Quantum Key Encapsulation -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="230" height="150" fill="#0d1512" stroke="#39FF88" stroke-width="1.5" rx="5"/>
    <text x="15" y="28" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#39FF88">01. QUANTUM KEY EXCH.</text>
    <line x1="15" y1="36" x2="215" y2="36" stroke="#1a2a22" stroke-width="1"/>

    <text x="15" y="60" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">KEM: <tspan fill="#39FF88">ML-KEM-1024</tspan></text>
    <text x="15" y="80" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Signatures: <tspan fill="#39FF88">SPHINCS+</tspan></text>
    <text x="15" y="100" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Derivation: <tspan fill="#39FF88">HKDF-SHA3</tspan></text>

    <rect x="15" y="115" width="200" height="20" fill="#070a08" rx="3"/>
    <text x="115" y="129" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#e0b93e">Quantum-Resistant Tunnel</text>
  </g>

  <!-- Arrow Step 1 to Step 2 -->
  <g fill="none" stroke="#2c4a3a" stroke-width="1.5">
    <path id="k1" d="M260 135 L330 135"/>
  </g>
  <circle r="4" fill="#39FF88">
    <animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#k1"/></animateMotion>
  </circle>

  <!-- STEP 2: Chaos-Positioned Pixel Matrix Steganography -->
  <g transform="translate(330, 60)">
    <rect x="0" y="0" width="260" height="150" fill="#0d1512" stroke="#e0b93e" stroke-width="1.5" rx="5"/>
    <text x="15" y="28" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#e0b93e">02. CHAOS STEGANOGRAPHY</text>
    <line x1="15" y1="36" x2="245" y2="36" stroke="#1a2a22" stroke-width="1"/>

    <!-- Animated Pixel Grid -->
    <g transform="translate(15, 48)">
      <text x="0" y="15" font-family="Fira Code, monospace" font-size="9" fill="#7a9a88">Payload weaving into image pixels:</text>

      <!-- 8x4 Grid of Pixel Blocks -->
      <g stroke="#1a2a22" stroke-width="1">
        <rect x="0" y="25" width="16" height="16" fill="#14201a"/>
        <rect x="20" y="25" width="16" height="16" fill="#39FF88"><animate attributeName="fill" values="#39FF88;#14201a;#39FF88" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="40" y="25" width="16" height="16" fill="#14201a"/>
        <rect x="60" y="25" width="16" height="16" fill="#e0b93e"><animate attributeName="fill" values="#e0b93e;#14201a;#e0b93e" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="80" y="25" width="16" height="16" fill="#14201a"/>
        <rect x="100" y="25" width="16" height="16" fill="#39FF88"/>
        <rect x="120" y="25" width="16" height="16" fill="#14201a"/>
        <rect x="140" y="25" width="16" height="16" fill="#e0b93e"><animate attributeName="fill" values="#14201a;#e0b93e;#14201a" dur="1.2s" repeatCount="indefinite"/></rect>

        <rect x="0" y="45" width="16" height="16" fill="#e0b93e"/>
        <rect x="20" y="45" width="16" height="16" fill="#14201a"/>
        <rect x="40" y="45" width="16" height="16" fill="#39FF88"><animate attributeName="fill" values="#39FF88;#14201a;#39FF88" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="60" y="45" width="16" height="16" fill="#14201a"/>
        <rect x="80" y="45" width="16" height="16" fill="#39FF88"/>
        <rect x="100" y="45" width="16" height="16" fill="#14201a"/>
        <rect x="120" y="45" width="16" height="16" fill="#e0b93e"/>
        <rect x="140" y="45" width="16" height="16" fill="#14201a"/>
      </g>

      <text x="168" y="45" font-family="Fira Code, monospace" font-size="9" fill="#e0b93e">Bits hidden in</text>
      <text x="168" y="58" font-family="Fira Code, monospace" font-size="9" fill="#e0b93e">Cover Image</text>
    </g>
  </g>

  <!-- Arrow Step 2 to Step 3 -->
  <g fill="none" stroke="#2c4a3a" stroke-width="1.5">
    <path id="k2" d="M590 135 L660 135"/>
  </g>
  <circle r="4" fill="#e0b93e">
    <animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#k2"/></animateMotion>
  </circle>

  <!-- STEP 3: Ordinary Image Output -->
  <g transform="translate(660, 60)">
    <rect x="0" y="0" width="210" height="150" fill="#0d1512" stroke="#39FF88" stroke-width="1.5" rx="5"/>
    <text x="15" y="28" font-family="Fira Code, monospace" font-size="11" font-weight="600" fill="#39FF88">03. COVER IMAGE OUT</text>
    <line x1="15" y1="36" x2="195" y2="36" stroke="#1a2a22" stroke-width="1"/>

    <text x="15" y="60" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Visual: <tspan fill="#39FF88">IDENTICAL IMAGE</tspan></text>
    <text x="15" y="80" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Detection: <tspan fill="#39FF88">ZERO ANOMALY</tspan></text>
    <text x="15" y="100" font-family="Fira Code, monospace" font-size="10" fill="#eafff2">Payload: <tspan fill="#e0b93e">RECOVERABLE</tspan></text>

    <rect x="15" y="115" width="180" height="20" fill="#070a08" rx="3"/>
    <text x="105" y="129" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#39FF88">Stego Payload Delivered</text>
  </g>
</svg>

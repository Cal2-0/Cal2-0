<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes race {
      0%   { transform: translateX(-160px); }
      100% { transform: translateX(920px); }
    }
    @keyframes dash {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    @keyframes wheel {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .car { animation: race 6s linear infinite; }
    .track-dash { animation: dash 0.8s linear infinite; }
    .wheel-spin { animation: wheel 0.3s linear infinite; transform-origin: center; }
  </style>

  <rect width="900" height="80" fill="#0E0F13"/>

  <!-- Track surface -->
  <rect x="0" y="30" width="900" height="26" fill="#151820" rx="2"/>

  <!-- Track dashes (animated) -->
  <line x1="0" y1="43" x2="900" y2="43" stroke="#2A2520" stroke-width="2" stroke-dasharray="20,20" class="track-dash"/>

  <!-- Track edges -->
  <line x1="0" y1="30" x2="900" y2="30" stroke="#C9B8A8" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#C9B8A8" stroke-width="0.5" opacity="0.3"/>

  <!-- F1 Car Group (animated) -->
  <g class="car">
    <!-- Car body -->
    <path d="M30 48 L40 38 L55 35 L90 33 L120 33 L135 35 L140 38 L145 42 L145 48 L30 48 Z" fill="#C9B8A8"/>
    <!-- Cockpit -->
    <path d="M70 38 L78 33 L95 33 L100 36 L98 38 Z" fill="#0E0F13"/>
    <!-- Front wing -->
    <path d="M140 44 L155 42 L158 44 L158 48 L145 48 Z" fill="#A89984"/>
    <!-- Rear wing -->
    <path d="M28 40 L35 36 L35 40 Z" fill="#A89984"/>
    <rect x="25" y="34" width="3" height="10" fill="#A89984" rx="1"/>
    <!-- Air intake -->
    <rect x="72" y="30" width="4" height="3" fill="#6B6560" rx="1"/>
    <!-- Wheels -->
    <g transform="translate(50, 48)">
      <circle r="6" fill="#2A2520" class="wheel-spin"/>
      <circle r="3" fill="#6B6560"/>
    </g>
    <g transform="translate(130, 48)">
      <circle r="5" fill="#2A2520" class="wheel-spin"/>
      <circle r="2.5" fill="#6B6560"/>
    </g>
    <!-- Exhaust particles -->
    <circle cx="22" cy="45" r="2" fill="#C9B8A8" opacity="0.3">
      <animate attributeName="opacity" values="0.4;0;0.4" dur="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="43" r="1.5" fill="#C9B8A8" opacity="0.2">
      <animate attributeName="opacity" values="0.3;0;0.3" dur="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Finish flag markers -->
  <rect x="0" y="62" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="8" y="62" width="8" height="8" fill="#0E0F13"/>
  <rect x="16" y="62" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="0" y="70" width="8" height="8" fill="#0E0F13"/>
  <rect x="8" y="70" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="16" y="70" width="8" height="8" fill="#0E0F13"/>

  <rect x="876" y="62" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="884" y="62" width="8" height="8" fill="#0E0F13"/>
  <rect x="892" y="62" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="876" y="70" width="8" height="8" fill="#0E0F13"/>
  <rect x="884" y="70" width="8" height="8" fill="#C9B8A8" opacity="0.15"/>
  <rect x="892" y="70" width="8" height="8" fill="#0E0F13"/>
</svg>

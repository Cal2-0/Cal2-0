<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="20%" stop-color="#161B26"/>
      <stop offset="80%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>
    
    <linearGradient id="car-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3B8CC"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#EAE0D5"/>
      <stop offset="100%" stop-color="#88C0D0"/>
    </linearGradient>

    <linearGradient id="drs-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88C0D0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes f1-drive {
      0%   { transform: translateX(-220px); }
      100% { transform: translateX(960px); }
    }
    @keyframes track-motion {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
    @keyframes wheel-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes taillight-pulse {
      0%, 100% { fill: #D4AF37; opacity: 1; filter: drop-shadow(0 0 4px #D4AF37); }
      50%      { fill: #88C0D0; opacity: 0.4; filter: drop-shadow(0 0 1px #88C0D0); }
    }

    .f1-car-group { animation: f1-drive 5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .track-line { animation: track-motion 0.5s linear infinite; }
    .wheel { animation: wheel-spin 0.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .tail-led { animation: taillight-pulse 0.4s infinite; }
  </style>

  <!-- Base Dark Container -->
  <rect width="900" height="130" fill="#0D1017" rx="6"/>

  <!-- Telemetry Top Bar -->
  <rect x="0" y="0" width="900" height="24" fill="#141824"/>
  <text x="20" y="16" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#D4AF37" letter-spacing="0.5">TELEMETRY // HYPERCAR OVERDRIVE</text>
  <text x="320" y="16" font-family="'Courier New', monospace" font-size="10" fill="#A3B8CC">RPM: 15,200</text>
  <text x="440" y="16" font-family="'Courier New', monospace" font-size="10" fill="#A3B8CC">SPEED: 342 KM/H</text>
  <text x="590" y="16" font-family="'Courier New', monospace" font-size="10" fill="#88C0D0">DRS: ACTIVE</text>
  <text x="730" y="16" font-family="'Courier New', monospace" font-size="10" fill="#EAE0D5">MODE: ATTACK</text>
  <line x1="0" y1="24" x2="900" y2="24" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>

  <!-- Race Track Surface -->
  <rect x="0" y="45" width="900" height="50" fill="url(#track-grad)"/>
  
  <!-- Outer Curb Strips -->
  <line x1="0" y1="45" x2="900" y2="45" stroke="#D4AF37" stroke-width="2" stroke-dasharray="15,15" opacity="0.6"/>
  <line x1="0" y1="95" x2="900" y2="95" stroke="#88C0D0" stroke-width="2" stroke-dasharray="15,15" opacity="0.6"/>

  <!-- Animated Track Center Dotted Line -->
  <line x1="0" y1="70" x2="900" y2="70" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="30,30" class="track-line" opacity="0.3"/>

  <!-- Animated F1 Hypercar -->
  <g class="f1-car-group" transform="translate(0, 35)">
    <!-- Aerodynamic DRS Trail Flow -->
    <path d="M0 32 L40 30 L90 32 Z" fill="url(#drs-glow)"/>
    <line x1="-30" y1="25" x2="25" y2="25" stroke="#88C0D0" stroke-width="1" opacity="0.6"/>
    <line x1="-50" y1="35" x2="15" y2="35" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

    <!-- Rear Wing Sub-structure -->
    <rect x="22" y="12" width="4" height="20" fill="#252830"/>
    <rect x="18" y="8" width="22" height="5" rx="1" fill="#D4AF37"/>
    <rect x="16" y="14" width="26" height="3" rx="1" fill="#88C0D0"/>
    <rect x="14" y="6" width="4" height="14" fill="#A3B8CC"/>

    <!-- Tail LED -->
    <rect x="18" y="24" width="4" height="6" rx="1" class="tail-led"/>

    <!-- Main Chassis Body -->
    <path d="M22 36 L175 36 L170 39 L25 39 Z" fill="#101216"/>
    <path d="M25 32 L45 26 L65 24 L85 18 L105 18 L125 22 L145 28 L175 32 L185 35 L175 37 L25 37 Z" fill="url(#car-body-grad)"/>
    <path d="M45 26 L80 14 L95 18 L65 26 Z" fill="#1F232D"/>

    <!-- Halo Safety Structure & Cockpit Canopy -->
    <path d="M85 18 L100 12 L112 18 Z" fill="#0D1017"/>
    <path d="M92 16 L108 16 L104 22 L88 22 Z" fill="#161B26" stroke="#88C0D0" stroke-width="0.8"/>
    <circle cx="96" cy="19" r="2.5" fill="#EAE0D5"/>

    <!-- Sidepod Intake Duct -->
    <path d="M78 24 L94 22 L98 28 L82 29 Z" fill="#0D1017" stroke="#D4AF37" stroke-width="0.5"/>

    <!-- Front Nose Cone & Front Wing Assembly -->
    <path d="M145 28 L180 34 L185 36 L145 34 Z" fill="#EAE0D5"/>
    <path d="M170 35 L198 35 L202 38 L168 38 Z" fill="#88C0D0"/>
    <rect x="196" y="28" width="4" height="11" rx="1" fill="#D4AF37"/>

    <!-- Wheels -->
    <g transform="translate(48, 35)">
      <circle r="13" fill="#15171C" stroke="#88C0D0" stroke-width="1"/>
      <circle r="9" fill="#0D1017"/>
      <g class="wheel">
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#D4AF37" stroke-width="1.5"/>
        <line x1="0" y1="-7" x2="0" y2="7" stroke="#D4AF37" stroke-width="1.5"/>
        <line x1="-5" y1="-5" x2="5" y2="5" stroke="#88C0D0" stroke-width="1"/>
        <line x1="-5" y1="5" x2="5" y2="-5" stroke="#88C0D0" stroke-width="1"/>
      </g>
      <circle r="3" fill="#EAE0D5"/>
    </g>

    <g transform="translate(155, 35)">
      <circle r="12" fill="#15171C" stroke="#88C0D0" stroke-width="1"/>
      <circle r="8" fill="#0D1017"/>
      <g class="wheel">
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#D4AF37" stroke-width="1.5"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#D4AF37" stroke-width="1.5"/>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#88C0D0" stroke-width="1"/>
        <line x1="-4" y1="4" x2="4" y2="-4" stroke="#88C0D0" stroke-width="1"/>
      </g>
      <circle r="2.5" fill="#EAE0D5"/>
    </g>
  </g>

  <!-- Bottom Line -->
  <line x1="0" y1="120" x2="900" y2="120" stroke="#1F232D" stroke-width="1"/>
</svg>

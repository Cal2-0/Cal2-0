<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13111C"/>
      <stop offset="20%" stop-color="#181524"/>
      <stop offset="80%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#13111C"/>
    </linearGradient>
    
    <linearGradient id="car-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A89FBF"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#EAE0D5"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes f1-drive {
      0%   { transform: translateX(-240px); }
      100% { transform: translateX(960px); }
    }
    @keyframes track-motion {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
    @keyframes wheel-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .f1-car-group { animation: f1-drive 5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .track-line { animation: track-motion 0.5s linear infinite; }
    .wheel { animation: wheel-spin 0.2s linear infinite; transform-box: fill-box; transform-origin: center; }
  </style>

  <!-- Borderless Container -->
  <rect width="900" height="120" fill="#13111C" rx="8"/>

  <!-- Telemetry Bar -->
  <text x="20" y="18" font-family="'Georgia', serif" font-size="10" font-weight="600" fill="#C5A059" letter-spacing="1">FORMULA 1 HYPERCAR TELEMETRY</text>
  <text x="340" y="18" font-family="sans-serif" font-size="10" fill="#A89FBF">RPM: 15,400</text>
  <text x="460" y="18" font-family="sans-serif" font-size="10" fill="#A89FBF">SPEED: 348 KM/H</text>
  <text x="600" y="18" font-family="sans-serif" font-size="10" fill="#C5A059">DRS: OPEN</text>
  <text x="740" y="18" font-family="'Georgia', serif" font-size="10" font-style="italic" fill="#EAE0D5">QUALIFYING LAP</text>
  <line x1="0" y1="26" x2="900" y2="26" stroke="#252136" stroke-width="1"/>

  <!-- Race Track -->
  <rect x="0" y="42" width="900" height="50" fill="url(#track-grad)"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#252136" stroke-width="1"/>
  <line x1="0" y1="92" x2="900" y2="92" stroke="#252136" stroke-width="1"/>
  <line x1="0" y1="67" x2="900" y2="67" stroke="#A89FBF" stroke-width="1" stroke-dasharray="25,25" class="track-line" opacity="0.2"/>

  <!-- F1 Open-Wheel Hypercar Silhouette -->
  <g class="f1-car-group" transform="translate(0, 32)">
    <!-- Aerodynamic Trail -->
    <line x1="-30" y1="23" x2="25" y2="23" stroke="#C5A059" stroke-width="1" opacity="0.4"/>
    <line x1="-50" y1="33" x2="15" y2="33" stroke="#A89FBF" stroke-width="1" opacity="0.3"/>

    <!-- High Rear Wing & Endplate -->
    <rect x="18" y="4" width="4" height="24" fill="#A89FBF"/>
    <rect x="12" y="4" width="28" height="5" rx="1" fill="#C5A059"/>
    <rect x="14" y="12" width="24" height="3" rx="1" fill="#EAE0D5"/>

    <!-- Tail LED -->
    <rect x="14" y="24" width="4" height="6" rx="1" fill="#C5A059"/>

    <!-- Chassis Body & Cockpit -->
    <path d="M20 34 L180 34 L175 38 L22 38 Z" fill="#13111C"/>
    <path d="M22 30 L45 22 L70 20 L95 14 L115 14 L135 18 L160 26 L185 33 L190 35 L22 35 Z" fill="url(#car-body-grad)"/>

    <!-- Engine Fin -->
    <path d="M45 22 L85 10 L100 14 L70 22 Z" fill="#252136"/>

    <!-- Halo Safety Arc & Driver Helmet -->
    <path d="M92 14 L108 8 L120 14 Z" fill="#13111C"/>
    <path d="M98 12 L114 12 L110 18 L94 18 Z" fill="#1B1829" stroke="#C5A059" stroke-width="0.8"/>
    <circle cx="102" cy="15" r="2.5" fill="#EAE0D5"/>

    <!-- Front Nose Cone & Low Front Wing Assembly -->
    <path d="M160 26 L195 33 L205 35 L160 33 Z" fill="#EAE0D5"/>
    <path d="M185 34 L218 34 L222 37 L182 37 Z" fill="#C5A059"/>
    <rect x="218" y="26" width="4" height="12" rx="1" fill="#A89FBF"/>

    <!-- Wheels (Open-Wheel F1 Slick Tires) -->
    <!-- Rear Tire -->
    <g transform="translate(48, 35)">
      <circle r="14" fill="#1B1829" stroke="#C5A059" stroke-width="1.2"/>
      <circle r="9" fill="#13111C"/>
      <g class="wheel">
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#A89FBF" stroke-width="1.5"/>
        <line x1="0" y1="-7" x2="0" y2="7" stroke="#A89FBF" stroke-width="1.5"/>
        <line x1="-5" y1="-5" x2="5" y2="5" stroke="#C5A059" stroke-width="1"/>
        <line x1="-5" y1="5" x2="5" y2="-5" stroke="#C5A059" stroke-width="1"/>
      </g>
      <circle r="3" fill="#EAE0D5"/>
    </g>

    <!-- Front Tire -->
    <g transform="translate(165, 35)">
      <circle r="13" fill="#1B1829" stroke="#C5A059" stroke-width="1.2"/>
      <circle r="8" fill="#13111C"/>
      <g class="wheel">
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#A89FBF" stroke-width="1.5"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#A89FBF" stroke-width="1.5"/>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#C5A059" stroke-width="1"/>
        <line x1="-4" y1="4" x2="4" y2="-4" stroke="#C5A059" stroke-width="1"/>
      </g>
      <circle r="2.5" fill="#EAE0D5"/>
    </g>
  </g>
</svg>

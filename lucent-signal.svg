<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="280" fill="#0a0e0c"/>
  <text x="30" y="34" font-family="Fira Code, monospace" font-size="13" fill="#4a6b58">lucent // frequency-domain anomaly scan</text>

  <text x="30" y="70" font-family="Fira Code, monospace" font-size="12" fill="#6ea882">real</text>
  <text x="470" y="70" font-family="Fira Code, monospace" font-size="12" fill="#e0b93e">synthetic</text>

  <!-- real signal bars: calm, low variance -->
  <g fill="#39FF88">
    <rect x="30"  y="150" width="10" height="30"><animate attributeName="height" values="30;24;30" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="150;156;150" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="46"  y="140" width="10" height="40"><animate attributeName="height" values="40;46;40" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="140;134;140" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="62"  y="130" width="10" height="50"><animate attributeName="height" values="50;44;50" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="130;136;130" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="78"  y="145" width="10" height="35"><animate attributeName="height" values="35;40;35" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="145;140;145" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="94"  y="135" width="10" height="45"><animate attributeName="height" values="45;40;45" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="135;140;135" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="110" y="148" width="10" height="32"><animate attributeName="height" values="32;36;32" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="148;144;148" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="126" y="138" width="10" height="42"><animate attributeName="height" values="42;38;42" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="138;142;138" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="142" y="152" width="10" height="28"><animate attributeName="height" values="28;32;28" dur="2.3s" repeatCount="indefinite"/><animate attributeName="y" values="152;148;152" dur="2.3s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="20" y1="180" x2="200" y2="180" stroke="#1a2a22" stroke-width="1"/>
  <text x="20" y="200" font-family="Fira Code, monospace" font-size="10" fill="#4a6b58">low variance · stable spectrum</text>

  <!-- arrow -->
  <text x="250" y="150" font-family="Fira Code, monospace" font-size="18" fill="#4a6b58">FFT →</text>

  <!-- synthetic signal bars: erratic, spiky, with a flagged anomaly spike -->
  <g fill="#e0b93e">
    <rect x="470" y="150" width="10" height="30"><animate attributeName="height" values="30;60;20;45;30" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="150;120;160;135;150" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="486" y="120" width="10" height="60"><animate attributeName="height" values="60;25;70;40;60" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="120;155;110;140;120" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="502" y="160" width="10" height="20"><animate attributeName="height" values="20;55;15;35;20" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="160;125;165;145;160" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="518" y="100" width="10" height="80" fill="#ff5c5c"><animate attributeName="height" values="80;90;80" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="100;90;100" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="534" y="145" width="10" height="35"><animate attributeName="height" values="35;65;25;50;35" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="145;115;155;130;145" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="550" y="130" width="10" height="50"><animate attributeName="height" values="50;20;60;35;50" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="130;160;120;145;130" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="566" y="155" width="10" height="25"><animate attributeName="height" values="25;58;18;40;25" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="155;122;162;140;155" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="582" y="140" width="10" height="40"><animate attributeName="height" values="40;70;22;52;40" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="140;110;158;128;140" dur="1.9s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="460" y1="180" x2="640" y2="180" stroke="#1a2a22" stroke-width="1"/>
  <text x="460" y="200" font-family="Fira Code, monospace" font-size="10" fill="#e0b93e">high-variance spike detected</text>

  <text x="30" y="250" font-family="Fira Code, monospace" font-size="11" fill="#4a6b58">status: active research · which signals generalize across unseen generators?</text>
</svg>

<svg width="435" height="200" viewBox="0 0 435 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mag-bg-sentinel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E17"/>
      <stop offset="100%" stop-color="#191629"/>
    </linearGradient>
    <linearGradient id="mag-border-sentinel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8A9D9"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B8A9D9"/>
    </linearGradient>
  </defs>

  <!-- Editorial Card Container -->
  <rect x="1" y="1" width="433" height="198" rx="8" fill="url(#mag-bg-sentinel)" stroke="url(#mag-border-sentinel)" stroke-width="1.2"/>
  
  <!-- Magazine Header Bar -->
  <text x="20" y="24" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#B8A9D9" letter-spacing="1.5">DOSSIER N° 02 ✦ INCIDENT ENGINE</text>
  <line x1="20" y1="32" x2="415" y2="32" stroke="#B8A9D9" stroke-width="0.5" opacity="0.3"/>

  <!-- Status Pill -->
  <rect x="310" y="10" width="105" height="18" rx="9" fill="#241E38" stroke="#B8A9D9" stroke-width="0.8"/>
  <text x="362" y="22" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B8A9D9" text-anchor="middle">ACTIVE ENGINE</text>

  <!-- Project Title -->
  <text x="20" y="66" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#F4EFE6">SentinelAI</text>
  <text x="145" y="64" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#B8A9D9">Linux Incident Response</text>

  <!-- Highlights -->
  <text x="20" y="92" font-family="sans-serif" font-size="11" fill="#F4EFE6">✦ 3-Vector Detection (Auth Logs + CVE + Code AST)</text>
  <text x="20" y="112" font-family="sans-serif" font-size="11" fill="#D2C8EC">✦ Unsupervised Anomaly Scoring via Isolation Forest</text>
  <text x="20" y="132" font-family="sans-serif" font-size="11" fill="#E5C158">✦ Automated AI Remediation &amp; EPSS Prioritisation</text>

  <!-- Stack Tags -->
  <rect x="20" y="154" width="62" height="22" rx="11" fill="#241E38" stroke="#E5C158" stroke-width="0.5"/>
  <text x="51" y="168" font-family="sans-serif" font-size="10" fill="#E5C158" text-anchor="middle">Python</text>

  <rect x="88" y="154" width="102" height="22" rx="11" fill="#241E38" stroke="#B8A9D9" stroke-width="0.5"/>
  <text x="139" y="168" font-family="sans-serif" font-size="10" fill="#B8A9D9" text-anchor="middle">Isolation Forest</text>

  <rect x="196" y="154" width="86" height="22" rx="11" fill="#241E38" stroke="#B8A9D9" stroke-width="0.5"/>
  <text x="239" y="168" font-family="sans-serif" font-size="10" fill="#B8A9D9" text-anchor="middle">AST Analysis</text>

  <rect x="288" y="154" width="76" height="22" rx="11" fill="#241E38" stroke="#B8A9D9" stroke-width="0.5"/>
  <text x="326" y="168" font-family="sans-serif" font-size="10" fill="#B8A9D9" text-anchor="middle">Gemini 2.0</text>
</svg>

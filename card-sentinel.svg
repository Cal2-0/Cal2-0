<svg width="435" height="190" viewBox="0 0 435 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg-sentinel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F13"/>
      <stop offset="100%" stop-color="#151922"/>
    </linearGradient>
    <linearGradient id="border-glow-sentinel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9B8A8"/>
      <stop offset="50%" stop-color="#39FF88"/>
      <stop offset="100%" stop-color="#C9B8A8"/>
    </linearGradient>
  </defs>

  <!-- Background Box -->
  <rect x="1" y="1" width="433" height="188" rx="8" fill="url(#card-bg-sentinel)" stroke="url(#border-glow-sentinel)" stroke-width="1.5"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="36" x2="435" y2="36" stroke="#C9B8A8" stroke-width="0.5" opacity="0.2"/>
  <line x1="300" y1="0" x2="300" y2="36" stroke="#C9B8A8" stroke-width="0.5" opacity="0.2"/>

  <!-- Status Light & Header Tag -->
  <circle cx="20" cy="18" r="4" fill="#39FF88">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#39FF88" letter-spacing="1">DEFENSE // INCIDENT RESPONSE</text>
  
  <rect x="312" y="8" width="112" height="20" rx="4" fill="#1C222E" stroke="#C9B8A8" stroke-width="0.5" opacity="0.8"/>
  <text x="368" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C9B8A8" text-anchor="middle">STATUS: ACTIVE</text>

  <!-- Project Title -->
  <text x="20" y="62" font-family="sans-serif" font-size="20" font-weight="bold" fill="#EAE0D5">SentinelAI</text>
  <text x="135" y="62" font-family="sans-serif" font-size="12" fill="#8A8078">· Linux Incident Engine</text>

  <!-- Key Highlights -->
  <text x="20" y="86" font-family="sans-serif" font-size="11" fill="#C9B8A8">• 3-Vector Detection (Auth Logs + CVE + Code AST)</text>
  <text x="20" y="104" font-family="sans-serif" font-size="11" fill="#C9B8A8">• Unsupervised Anomaly Scoring via Isolation Forest</text>
  <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#C9B8A8">• Automated AI Remediation &amp; EPSS Prioritisation</text>

  <!-- Tech Badges Bar -->
  <rect x="20" y="142" width="62" height="22" rx="4" fill="#1C222E" stroke="#39FF88" stroke-width="0.5"/>
  <text x="51" y="156" font-family="sans-serif" font-size="10" fill="#39FF88" font-weight="bold" text-anchor="middle">Python</text>

  <rect x="88" y="142" width="102" height="22" rx="4" fill="#1C222E" stroke="#39FF88" stroke-width="0.5"/>
  <text x="139" y="156" font-family="sans-serif" font-size="10" fill="#39FF88" font-weight="bold" text-anchor="middle">Isolation Forest</text>

  <rect x="196" y="142" width="86" height="22" rx="4" fill="#1C222E" stroke="#C9B8A8" stroke-width="0.5"/>
  <text x="239" y="156" font-family="sans-serif" font-size="10" fill="#C9B8A8" font-weight="bold" text-anchor="middle">AST Analysis</text>

  <rect x="288" y="142" width="76" height="22" rx="4" fill="#1C222E" stroke="#C9B8A8" stroke-width="0.5"/>
  <text x="326" y="156" font-family="sans-serif" font-size="10" fill="#C9B8A8" font-weight="bold" text-anchor="middle">Gemini 2.0</text>
</svg>
